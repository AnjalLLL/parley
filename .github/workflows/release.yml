name: Release
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }   # PyPI trusted publishing, no token secret
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Tag must match package version
        run: grep -q "^__version__ = \"${GITHUB_REF_NAME#v}\"" src/voxwire/__init__.py
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }

  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions: { contents: read, id-token: write }  # npm trusted publishing + provenance
    defaults: { run: { working-directory: js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: Tag must match package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm install -g npm@latest  # trusted publishing needs npm >= 11.5
      - run: npm test
      - run: npm publish --provenance --access public
        # npm can't enable trusted publishing until the package exists, so the first release uses a token.
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: voxwire-server, context: python }
          - { name: voxwire-sfu, context: sfu }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [pypi, npm, images]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
