name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra server
      - run: uv run ruff check
      - run: uv run pytest -q --cov=voxwire --cov-report=term
      - run: uv build

  js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: js } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm pack --dry-run

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uvx --with mkdocs-material==9.8.0 mkdocs build --strict
        env: { NO_MKDOCS_2_WARNING: "1" }

  sfu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dockerfile runs protoc, go vet and go test, so building it is the check.
      - run: docker build sfu
