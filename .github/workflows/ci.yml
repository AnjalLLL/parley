name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra server
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv build

  sfu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dockerfile runs protoc, go vet and go test, so building it is the check.
      - run: docker build sfu
