# coturn with time-limited credentials. Voxwire signs them with the same TURN_SECRET.
# In .env: TURN_ENABLED=true, TURN_URL=turn:<your-domain>:3478, TURN_SECRET=<same secret>
listening-port=3478
fingerprint
use-auth-secret
realm=voxwire
min-port=49160
max-port=49200
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
