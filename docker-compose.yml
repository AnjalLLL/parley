# Local development: builds from source. For prebuilt images see deploy/docker-compose.yml.
services:
  server:
    build: ./python
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PION_GRPC_URL=sfu:50051
    depends_on:
      - sfu
    volumes:
      - ./python/src:/app/src
    command: uv run --no-sync voxwire serve --host 0.0.0.0 --port 8000 --reload

  sfu:
    build: ./sfu
    ports:
      - "50051:50051"    # gRPC
      - "5000-5100:5000-5100/udp"  # RTP media
    environment:
      - PION_LOG_INFO=*
      - PION_PUBLIC_IP=${PION_PUBLIC_IP:-127.0.0.1}

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - server
